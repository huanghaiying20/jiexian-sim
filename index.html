<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>电路接线模拟</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="circuit-page">
        <div class="circuit-header">
            <h1>电路接线模拟</h1>
            <div class="tips">从接口拖拽连线 | 右键删除组件</div>
        </div>

        <div class="circuit-container">
            <div class="circuit-component-panel">
                <div class="panel-header">
                    <div class="component-panel-title">元件列表</div>
                    <button class="add-btn" id="add-component-btn" title="添加组件"><i class="fas fa-plus"></i></button>
                </div>
                <div class="component-slots" id="component-slots"></div>
            </div>
            <div class="canvas-wrapper">
                <div class="canvas-grid"></div>
                <div class="canvas-content"></div>
                <canvas id="canvas"></canvas>

                <div id="score-display" class="score-display"></div>

                <div class="toolbar">
                    <button id="select-btn" class="active">选择</button>
                    <button id="delete-line-btn">删除连线</button>
                    <button id="undo-btn">撤回上一步</button>
                    <button id="reset-btn">重置接线</button>
                    <button id="submit-btn">提交</button>
                </div>
            </div>
            <div class="circuit-task-panel">
                <div class="panel-header">
                    <div class="task-panel-title">任务选择</div>
                    <button class="add-btn" id="add-task-btn" title="添加任务"><i class="fas fa-plus"></i></button>
                </div>
                <div class="task-slots" id="task-slots"></div>
            </div>
        </div>

        <!-- 组件添加弹窗 -->
        <div id="component-modal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>添加新组件</h3>
                    <button class="modal-close" data-close="component-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>组件名称</label>
                        <input type="text" id="new-comp-name" placeholder="如：开关">
                    </div>
                    <div class="form-group">
                        <label>上传图片</label>
                        <input type="file" id="new-comp-image" accept="image/*">
                    </div>
                    <div class="form-hint">组件将使用默认尺寸（120×170）和2个接线端口（+/-）</div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" data-close="component-modal">取消</button>
                    <button class="btn-primary" id="save-component-btn">保存</button>
                </div>
            </div>
        </div>

        <!-- 任务添加弹窗 -->
        <div id="task-modal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3>添加新任务</h3>
                    <button class="modal-close" data-close="task-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>任务名称</label>
                        <input type="text" id="new-task-name" placeholder="如：串联电路">
                    </div>
                    <div class="form-group">
                        <label>上传图片</label>
                        <input type="file" id="new-task-image" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" data-close="task-modal">取消</button>
                    <button class="btn-primary" id="save-task-btn">保存</button>
                </div>
            </div>
        </div>

        <!-- 提示弹窗 -->
        <div id="alert-modal" class="modal-overlay">
            <div class="modal" style="width:360px;">
                <div class="modal-header">
                    <h3 id="alert-title">提示</h3>
                </div>
                <div class="modal-body" style="text-align:center;padding:24px 20px;">
                    <div id="alert-message" style="font-size:15px;color:#555;line-height:1.6;"></div>
                </div>
                <div class="modal-footer" style="justify-content:center;">
                    <button class="btn-primary" id="alert-ok">确定</button>
                </div>
            </div>
        </div>

        <!-- 确认删除弹窗 -->
        <div id="confirm-modal" class="modal-overlay">
            <div class="modal" style="width:360px;">
                <div class="modal-header">
                    <h3>确认删除</h3>
                </div>
                <div class="modal-body" style="text-align:center;padding:24px 20px;">
                    <div id="confirm-message" style="font-size:15px;color:#555;line-height:1.6;"></div>
                </div>
                <div class="modal-footer" style="justify-content:center;">
                    <button class="btn-secondary" id="confirm-cancel">取消</button>
                    <button class="btn-primary" id="confirm-ok">确定</button>
                </div>
            </div>
        </div>

        <!-- 学生信息弹窗(提交时填写) -->
        <div id="student-info-modal" class="modal-overlay">
            <div class="modal" style="width:380px;">
                <div class="modal-header">
                    <h3>提交前请填写信息</h3>
                    <button class="modal-close" data-close="student-info-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>学号 <span style="color:#e74c3c">*</span></label>
                        <input type="text" id="submit-student-id" placeholder="如 2024001" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>班级 <span style="color:#e74c3c">*</span></label>
                        <input type="text" id="submit-class-name" placeholder="如 电子2401班" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>姓名 <span style="color:#e74c3c">*</span></label>
                        <input type="text" id="submit-student-name" placeholder="如 张三" autocomplete="off">
                    </div>
                    <div class="form-hint">信息会随接线图一起提交给 AI 评分并保存到学情数据库</div>
                </div>
                <div class="modal-footer" style="justify-content:center;">
                    <button class="btn-secondary" data-close="student-info-modal">取消</button>
                    <button class="btn-primary" id="submit-confirm-btn">确认提交</button>
                </div>
            </div>
        </div>

        <!-- 评分加载中弹窗 -->
        <div id="grading-modal" class="modal-overlay">
            <div class="modal" style="width:340px;">
                <div class="modal-body" style="text-align:center;padding:32px 20px;">
                    <div style="font-size:36px;color:#3498db;margin-bottom:12px;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                    <div id="grading-message" style="font-size:15px;color:#555;">AI 评分中,请稍候...</div>
                    <div style="font-size:12px;color:#999;margin-top:8px;">通常需要 5-15 秒</div>
                </div>
            </div>
        </div>

        <!-- 评分结果弹窗 -->
        <div id="score-modal" class="modal-overlay">
            <div class="modal" style="width:460px;max-width:92vw;">
                <div class="modal-header">
                    <h3>AI 评分结果</h3>
                    <button class="modal-close" data-close="score-modal">&times;</button>
                </div>
                <div class="modal-body" style="padding:20px 24px;">
                    <div style="text-align:center;margin-bottom:16px;">
                        <div id="score-big-number" style="font-size:64px;font-weight:bold;color:#27ae60;line-height:1;">--</div>
                        <div style="font-size:14px;color:#999;margin-top:4px;">分 (满分 100)</div>
                    </div>
                    <div style="background:#f8f9fa;padding:12px;border-radius:6px;margin-bottom:12px;">
                        <div style="font-size:13px;color:#666;margin-bottom:4px;"><strong>任务类型</strong></div>
                        <div id="score-task-type" style="font-size:15px;color:#333;">--</div>
                    </div>
                    <div id="score-error-block" style="background:#fff3f3;padding:12px;border-radius:6px;margin-bottom:12px;display:none;">
                        <div style="font-size:13px;color:#c0392b;margin-bottom:4px;"><strong>主要错误</strong></div>
                        <div id="score-error-category" style="font-size:14px;color:#555;"></div>
                    </div>
                    <div style="background:#f0f7ff;padding:12px;border-radius:6px;">
                        <div style="font-size:13px;color:#2980b9;margin-bottom:4px;"><strong>详细评语</strong></div>
                        <div id="score-analysis" style="font-size:14px;color:#333;line-height:1.7;white-space:pre-wrap;">--</div>
                    </div>
                </div>
                <div class="modal-footer" style="justify-content:center;">
                    <button class="btn-primary" data-close="score-modal">完成</button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
